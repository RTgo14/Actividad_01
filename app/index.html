<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Mesa de Ayuda IT</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Mesa de Ayuda - Incidencias Tecnológicas</h1>
    </header>

    <main class="container">
        <!-- Panel Izquierdo: Formulario -->
        <section class="form-section">
            <h2>Registrar Incidencia</h2>
            <form id="form-incidencia">
                <div class="form-group">
                    <label for="titulo">Título de la incidencia:</label>
                    <input type="text" id="titulo" placeholder="Ej. Fallo en servidor">
                </div>
                <div class="form-group">
                    <label for="descripcion">Descripción detallada:</label>
                    <textarea id="descripcion" rows="4" placeholder="Describe el problema..."></textarea>
                </div>
                <div class="form-group">
                    <label for="prioridad">Prioridad:</label>
                    <select id="prioridad">
                        <option value="">Seleccione...</option>
                        <option value="Alta">Alta</option>
                        <option value="Media">Media</option>
                        <option value="Baja">Baja</option>
                    </select>
                </div>
                <!-- Mensajes de validación -->
                <div id="mensaje-error" class="error-msg hidden"></div>
                <button type="submit" class="btn-primary">Guardar Incidencia</button>
            </form>
        </section>

        <!-- Panel Derecho: Formulario -->
        <section class="list-section">
            <div class="filters">
                <input type="text" id="buscar" placeholder="Buscar por título...">
                <select id="filtro-prioridad">
                    <option value="Todas">Todas las prioridades</option>
                    <option value="Alta">Alta</option>
                    <option value="Media">Media</option>
                    <option value="Baja">Baja</option>
                </select>
            </div>
            
            <p style="margin-bottom: 1rem; font-weight: bold;">Total registros: <span id="contador-registros">0</span></p>

            <div id="toast-exito" class="toast hidden">Incidencia guardada con éxito</div>
            
            <div id="lista-incidencias" class="incidencias-grid">
                <!-- Se renderiza dinámicamente con JS -->
           </div>
        </section>
    </main>

    <!-- Modal de Detalle -->
    <div id="modal-detalle" class="modal hidden">
        <div class="modal-content">
            <span id="close-modal" class="close-btn">&times;</span>
            <h2 id="modal-titulo">Título</h2>
            <div class="modal-body">
                <p><strong>Estado:</strong> <span id="modal-estado"></span></p>
                <p><strong>Prioridad:</strong> <span id="modal-prioridad"></span></p>
                <p><strong>Fecha de Registro:</strong> <span id="modal-fecha"></span></p>
                <p><strong>Descripción:</strong></p>
                <p id="modal-descripcion"></p>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
