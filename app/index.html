<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Mesa de Ayuda IT</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Mesa de Ayuda - Incidencias Tecnológicas</h1>
    </header>

    <main class="container">
        <!-- Panel Izquierdo: Formulario -->
        <section class="form-section">
            <h2>Registrar Incidencia</h2>
            <form id="form-incidencia">
                <div class="form-group">
                    <label for="titulo">Título de la incidencia:</label>
                    <input type="text" id="titulo" placeholder="Ej. Fallo en servidor">
                </div>
                <div class="form-group">
                    <label for="descripcion">Descripción detallada:</label>
                    <textarea id="descripcion" rows="4" placeholder="Describe el problema..."></textarea>
                </div>
                <div class="form-group">
                    <label for="prioridad">Prioridad:</label>
                    <select id="prioridad">
                        <option value="">Seleccione...</option>
                        <option value="Alta">Alta</option>
                        <option value="Media">Media</option>
                        <option value="Baja">Baja</option>
                    </select>
                </div>
                <!-- Mensajes de validación -->
                <div id="mensaje-error" class="error-msg hidden"></div>
                <button type="submit" class="btn-primary">Guardar Incidencia</button>
            </form>
        </section>

        <!-- Panel Derecho: Formulario -->
        <section class="list-section">
            <div class="filters">
                <input type="text" id="buscar" placeholder="Buscar por título...">
                <select id="filtro-prioridad">
                    <option value="Todas">Todas las prioridades</option>
                    <option value="Alta">Alta</option>
                    <option value="Media">Media</option>
                    <option value="Baja">Baja</option>
                </select>
            </div>
            
            <div id="lista-incidencias" class="incidencias-grid">
                <!-- Se renderiza dinámicamente con JS -->
           </div>
        </section>
    </main>

    <!-- MODAL  -->
    <div id="modal-incidencia" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-titulo">Detalles de la Incidencia</h3>
                <span class="close-btn" id="cerrar-modal">&times;</span>
            </div>
            
            <div class="modal-body">
                <div class="detalle-grupo">
                    <strong>Título:</strong> 
                    <p id="detalle-titulo">Fallo en servidor principal</p>
                </div>
                <div class="detalle-grupo">
                    <strong>Descripción:</strong> 
                    <p id="detalle-descripcion">El servidor no responde a los pings desde las 08:00 AM.</p>
                </div>
                <div class="detalle-grupo">
                    <strong>Prioridad:</strong> 
                    <span id="detalle-prioridad" class="badge">Alta</span>
                </div>
                
                <!-- Opciones de actualizacion -->
                <div class="form-group mt-2">
                    <label for="cambiar-estado"><strong>Actualizar Estado:</strong></label>
                    <select id="cambiar-estado">
                        <option value="Abierta">Abierta</option>
                        <option value="En Progreso">En Progreso</option>
                        <option value="Resuelta">Resuelta</option>
                    </select>
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn-secondary" id="btn-cancelar-modal">Cerrar</button>
                <button class="btn-primary" id="btn-guardar-estado">Guardar Cambios</button>
            </div>
        </div>
    </div>

</body>
</html>
